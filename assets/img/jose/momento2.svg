<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640">
<style>
.anda, .bote, .pierna1, .pierna2, .ticket, .calendario, .gota, .rayas, .duda,
.tiembla, .ira, .movil, .rayas3, .flota, .nota { transform-box: fill-box; }
.flota { transform-origin: 50% 100%; animation: flota 3.2s ease-in-out infinite alternate; }
.f2 { animation-duration: 3.9s; animation-delay: -1.3s; }
.f3 { animation-duration: 4.5s; animation-delay: -2.4s; }
@keyframes flota { from { transform: translateY(4px) rotate(-2.5deg); } to { transform: translateY(-14px) rotate(2.5deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.d1, .d2, .d3, .d4 { opacity: 0; }
.d1 { animation: d1 8s infinite; } @keyframes d1 { 0%, 22% { opacity: 1; } 24%, 100% { opacity: 0; } }
.d2 { animation: d2 8s infinite; } @keyframes d2 { 0%, 23% { opacity: 0; } 25%, 47% { opacity: 1; } 49%, 100% { opacity: 0; } }
.d3 { animation: d3 8s infinite; } @keyframes d3 { 0%, 48% { opacity: 0; } 50%, 72% { opacity: 1; } 74%, 100% { opacity: 0; } }
.d4 { opacity: 1; animation: d4 8s infinite; } @keyframes d4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }
.calendario { transform-origin: 50% 0%; animation: hoja 8s ease-out infinite; }
@keyframes hoja { 0%, 20%, 30%, 45%, 55%, 70%, 80%, 100% { transform: none; } 24%, 49%, 74% { transform: rotate(-7deg) translateY(-6px); } }
.gota { transform-origin: 50% 0%; animation: gota 1.6s ease-in infinite; }
@keyframes gota { 0% { transform: translateY(-6px) scale(.6); opacity: 0; } 20% { opacity: 1; transform: none; } 100% { transform: translateY(46px); opacity: 0; } }
.rayas { animation: parpadeo .7s steps(2, jump-none) infinite alternate; }
@keyframes parpadeo { from { opacity: 1; } to { opacity: .15; } }
.duda { transform-origin: 50% 100%; animation: duda 2.6s ease-in-out infinite alternate; }
@keyframes duda { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
.nota { transform-origin: 50% 100%; animation: nota 2.4s ease-out infinite; }
@keyframes nota { 0% { transform: translate(0, 10px) scale(.6); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(14px, -46px) rotate(12deg); opacity: 0; } }
</style>
